spring:
  datasource:
    url: jdbc:mysql://localhost:3306/employee_management?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
    username: employee_app
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.employee_management_spring: DEBUG
    org.hibernate.SQL: DEBUG
