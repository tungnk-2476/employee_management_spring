spring:
  application:
    name: employee-management

  jpa:
    open-in-view: false

  cache:
    type: caffeine
    cache-names: employee-count
    caffeine:
      spec: maximumSize=100,expireAfterWrite=1m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

info:
  app:
    name: Employee Management System
    description: Spring Boot learning project
